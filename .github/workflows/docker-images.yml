name: Docker images
# Builds the three images and publishes them to GitHub's container registry (ghcr.io), so anyone can
# run the site with docker-compose.ghcr.yml and no clone or local build:
#   ghcr.io/<owner>/<repo>/backend, /storefront, /staff   tags: latest (main), sha-<commit>, v* tags
# Pull requests build the images (to catch a broken Dockerfile) but publish nothing.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
            build-args: ""
          - name: storefront
            dockerfile: frontend/Dockerfile
            # Public values (they end up in the browser anyway), baked in at build time by Vite.
            # Set them under Settings > Secrets and variables > Actions > Variables.
            build-args: |
              APP=storefront
              VITE_STRIPE_PUBLISHABLE_KEY=${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
              VITE_MAPBOX_TOKEN=${{ vars.VITE_MAPBOX_TOKEN }}
          - name: staff
            dockerfile: frontend/Dockerfile
            build-args: |
              APP=staff-dashboard
    steps:
      - uses: actions/checkout@v4
      # arm64 too, for teammates on Apple Silicon. The arm64 half is emulated, so it is the slow part.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
