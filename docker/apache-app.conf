# Apache for a compiled React SPA: static files, browser-route fallback, /api reverse proxy.
ServerName localhost
ServerTokens Prod

# /api/* goes to gunicorn (the "backend" service). The browser only ever sees one origin.
ProxyPreserveHost On
ProxyPass        /api http://backend:5000/api
ProxyPassReverse /api http://backend:5000/api

<Directory "/usr/local/apache2/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]
</Directory>

# Basic browser hardening on every response (pages and /api). Not set: a Content-Security-Policy, because
# Stripe Elements, Mapbox and the OpenStreetMap tiles each need their own allowances and a wrong policy
# silently breaks checkout.
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

# Vite fingerprints everything under /assets, so cache it hard. index.html must never be cached.
<LocationMatch "^/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
<Location "/index.html">
    Header set Cache-Control "no-cache"
</Location>
